[workspace]
members = ["flight-core", "flight-sitl", "web-decoder"]
exclude = ["flight-esp32s3", "bridge"]
resolver = "3"

[workspace.dependencies]
nalgebra = {version = "0.35.0", features = ["bytemuck", "convert-bytemuck", "libm", "defmt", "macros", "serde-serialize-no-std"], default-features = false}
num-traits = {version = "0.2.19", default-features = false }
serde = { version = "1.0", default-features = false }
postcard = "1.1"


